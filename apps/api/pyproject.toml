[project]
name = "ide-api"
version = "0.1.0"
description = "Integrated Document Environment API"
authors = [
    {name = "mongmeo-dev",email = "mongmeo.dev@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.3,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "psycopg[binary,pool] (>=3.3.4,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "openai (>=3.1.0,<4.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "boto3 (>=1.43.72,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "pikepdf (>=10.11.0,<11.0.0)",
    "opencv-python-headless (>=5.0.0.93,<6.0.0.0)"
]

[project.scripts]
ide-create-user = "ide_api.cmd.create_user:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "ide_api", from = "src"}]

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
