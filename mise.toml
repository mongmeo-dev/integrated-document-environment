[env]
_.file = ".env"

[tools]
node = "24"
poetry = "2"
python = "3.14"

[tasks."dev:web"]
description = "Web 개발 서버를 실행합니다"
run = "pnpm --dir apps/web dev"

[tasks."dev:api"]
description = "API 개발 서버를 실행합니다"
run = "poetry -C apps/api run uvicorn ide_api.cmd.api:app --reload"

[tasks."dev:worker"]
description = "문서 관계 분석 worker를 실행합니다"
run = "poetry -C apps/api run celery -A ide_api.cmd.worker:app worker --beat --loglevel=INFO"

[tasks.dev]
description = "Web, API와 비동기 worker를 함께 실행합니다"
depends = ["dev:web", "dev:api", "dev:worker"]
